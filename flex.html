<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .flex-items{
            background-color:aqua;
            padding: 10px;
            margin: 10px;
            width:200px;
            height: 150px;
            margin-top: 10px;
            color: white;
            font-size:50px;
            border: solid 5px;
            /* text-align:center; */
            border-radius: 20px;
            display:flex;
            justify-content:center;
             align-items: center; 
        }

        .flex-container{
            display: flex;
            flex-wrap:wrap;
            flex-direction:row;
            justify-content:center;
            list-style:none;
        }
        .flex_image{
            width:100%;
            height:100%;
        }

        
    </style>
</head>
<body>
    <!-- ul.flex-container>li-items*10 -->
    <ul class="flex-container">
        <li class="flex-items"> 
           <img src="images/bappa2.jpg" class="flex_image"> 
        </li>
        <li class="flex-items">2</li>
        <li class="flex-items">3</li>
        <li class="flex-items">4</li>
        <li class="flex-items">5</li>
        <li class="flex-items">6</li>
        <li class="flex-items">7</li>
        <li class="flex-items">8</li>
        <li class="flex-items">9</li>
        <li class="flex-items">10</li>
    </ul>
</body>
</html>
